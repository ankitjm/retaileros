# Nginx config for retaileros.in
# Place at: /etc/nginx/sites-available/retaileros.in
# Symlink: ln -s /etc/nginx/sites-available/retaileros.in /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name retaileros.in www.retaileros.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name retaileros.in www.retaileros.in;

    ssl_certificate     /etc/letsencrypt/live/retaileros.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/retaileros.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Landing page — served from static files
    root /root/Projects/RetailerOS/landing-page;
    index index.html;

    location = / {
        try_files /index.html =404;
    }

    # App — proxy to RetailerOS Express server (port 3006)
    location /app/ {
        proxy_pass http://127.0.0.1:3006/app/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Health check
    location /app/api/health {
        proxy_pass http://127.0.0.1:3006/app/api/health;
        proxy_set_header Host $host;
    }
}
