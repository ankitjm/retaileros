<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RetailerOS Admin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; color: #1a1a2e; min-height: 100vh; }

    /* ── Login ── */
    #login-screen {
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
    }
    .login-card {
      background: #fff; border-radius: 16px; padding: 40px; width: 360px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    }
    .login-card h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .login-card p  { font-size: 13px; color: #666; margin-bottom: 24px; }
    .login-card input {
      width: 100%; padding: 12px 14px; border: 1.5px solid #e2e8f0;
      border-radius: 10px; font-size: 15px; outline: none; margin-bottom: 14px;
    }
    .login-card input:focus { border-color: #6366f1; }
    .login-card button {
      width: 100%; padding: 13px; background: #6366f1; color: #fff;
      border: none; border-radius: 10px; font-size: 15px; font-weight: 600;
      cursor: pointer;
    }
    .login-card button:hover { background: #4f46e5; }
    #login-error { color: #ef4444; font-size: 13px; margin-top: 10px; display: none; }

    /* ── App Shell ── */
    #app { display: none; }
    header {
      background: #fff; border-bottom: 1px solid #e2e8f0;
      padding: 0 28px; height: 60px; display: flex; align-items: center;
      justify-content: space-between; position: sticky; top: 0; z-index: 10;
    }
    header .brand { font-size: 17px; font-weight: 700; }
    header .brand span { color: #6366f1; }
    header .logout-btn {
      font-size: 13px; color: #6b7280; cursor: pointer; border: none;
      background: none; padding: 6px 12px; border-radius: 8px;
    }
    header .logout-btn:hover { background: #f3f4f6; }

    /* ── Stats bar ── */
    .stats-bar {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px; padding: 24px 28px 0;
    }
    .stat-card {
      background: #fff; border-radius: 12px; padding: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .stat-card .label { font-size: 12px; color: #6b7280; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-card .value { font-size: 30px; font-weight: 800; margin-top: 4px; }
    .stat-card .sub   { font-size: 12px; color: #9ca3af; margin-top: 2px; }

    /* ── Tabs ── */
    .tabs {
      display: flex; gap: 4px; padding: 20px 28px 0;
    }
    .tab {
      padding: 8px 18px; border-radius: 8px; font-size: 14px; font-weight: 500;
      cursor: pointer; border: none; background: none; color: #6b7280;
    }
    .tab:hover { background: #f3f4f6; }
    .tab.active { background: #ede9fe; color: #6366f1; font-weight: 700; }

    /* ── Panel ── */
    .panel { display: none; padding: 20px 28px 40px; }
    .panel.active { display: block; }

    /* ── Table ── */
    .table-wrap {
      background: #fff; border-radius: 12px; overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06); margin-top: 16px;
    }
    .table-toolbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 20px; border-bottom: 1px solid #f0f0f0;
    }
    .table-toolbar .title { font-size: 15px; font-weight: 600; }
    .table-toolbar .count { font-size: 13px; color: #6b7280; }
    .export-btn {
      padding: 8px 16px; background: #6366f1; color: #fff;
      border: none; border-radius: 8px; font-size: 13px; font-weight: 600;
      cursor: pointer;
    }
    .export-btn:hover { background: #4f46e5; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      text-align: left; padding: 11px 16px; font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.05em; color: #6b7280;
      background: #fafafa; border-bottom: 1px solid #f0f0f0;
    }
    td { padding: 12px 16px; border-bottom: 1px solid #f8f8f8; vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafafa; }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 20px;
      font-size: 11px; font-weight: 600;
    }
    .badge-active  { background: #d1fae5; color: #065f46; }
    .badge-pending { background: #fef3c7; color: #92400e; }
    .no-data { text-align: center; padding: 48px; color: #9ca3af; font-size: 14px; }

    /* ── CTA chart ── */
    .cta-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px;
    }
    .cta-card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    .cta-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 14px; }
    .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .bar-label { width: 140px; font-size: 12px; color: #374151; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar-track { flex: 1; height: 8px; background: #f0f0f0; border-radius: 4px; overflow: hidden; }
    .bar-fill  { height: 100%; background: #6366f1; border-radius: 4px; transition: width 0.6s ease; }
    .bar-count { width: 36px; text-align: right; font-size: 12px; color: #6b7280; flex-shrink: 0; }

    /* ── Loading spinner ── */
    .spinner {
      display: inline-block; width: 20px; height: 20px;
      border: 2px solid rgba(99,102,241,0.2); border-top-color: #6366f1;
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    .loading-row { text-align: center; padding: 40px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 768px) {
      .stats-bar { padding: 16px; }
      .tabs { padding: 12px 16px 0; overflow-x: auto; }
      .panel { padding: 12px 16px 40px; }
      .cta-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- Login Screen -->
<div id="login-screen">
  <div class="login-card">
    <h1>RetailerOS Admin</h1>
    <p>Enter your admin password to continue</p>
    <input type="password" id="pw-input" placeholder="Admin password" autocomplete="current-password" />
    <button id="pw-btn">Sign in</button>
    <div id="login-error">Incorrect password. Try again.</div>
  </div>
</div>

<!-- App -->
<div id="app">
  <header>
    <div class="brand">Retailer<span>OS</span> Admin</div>
    <button class="logout-btn" id="logout-btn">Sign out</button>
  </header>

  <!-- Stats -->
  <div class="stats-bar" id="stats-bar">
    <div class="stat-card"><div class="label">Total Signups</div><div class="value" id="s-total">—</div><div class="sub">all time</div></div>
    <div class="stat-card"><div class="label">Signups Today</div><div class="value" id="s-today">—</div><div class="sub">registered today</div></div>
    <div class="stat-card"><div class="label">Waitlist</div><div class="value" id="s-waitlist">—</div><div class="sub">waiting</div></div>
    <div class="stat-card"><div class="label">CTA Clicks</div><div class="value" id="s-cta">—</div><div class="sub">landing page</div></div>
    <div class="stat-card"><div class="label">Conversion Rate</div><div class="value" id="s-conv">—</div><div class="sub">signups / CTA clicks</div></div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" data-tab="signups">Signups</button>
    <button class="tab" data-tab="waitlist">Waitlist</button>
    <button class="tab" data-tab="cta">CTA Events</button>
  </div>

  <!-- Signups Panel -->
  <div class="panel active" id="panel-signups">
    <div class="table-wrap">
      <div class="table-toolbar">
        <div>
          <div class="title">All Signups</div>
          <div class="count" id="signup-count">Loading…</div>
        </div>
        <button class="export-btn" id="export-btn">Export CSV</button>
      </div>
      <div id="signups-table-body">
        <div class="loading-row"><div class="spinner"></div></div>
      </div>
    </div>
  </div>

  <!-- Waitlist Panel -->
  <div class="panel" id="panel-waitlist">
    <div class="table-wrap">
      <div class="table-toolbar">
        <div>
          <div class="title">Waitlist Entries</div>
          <div class="count" id="waitlist-count">Loading…</div>
        </div>
      </div>
      <div id="waitlist-table-body">
        <div class="loading-row"><div class="spinner"></div></div>
      </div>
    </div>
  </div>

  <!-- CTA Panel -->
  <div class="panel" id="panel-cta">
    <div class="cta-grid" id="cta-grid">
      <div class="loading-row"><div class="spinner"></div></div>
    </div>
  </div>
</div>

<script>
  var adminPassword = null;

  // ── Helpers ──────────────────────────────────────────────────────────────
  function apiGet(path) {
    return fetch(path, {
      headers: { 'x-admin-password': adminPassword }
    }).then(function(r) {
      if (r.status === 401) { showLogin(); return Promise.reject('auth'); }
      return r.json();
    });
  }

  function fmtDate(ts) {
    if (!ts) return '—';
    try { return new Date(ts).toLocaleString('en-IN', {day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'}); }
    catch(e) { return ts; }
  }

  function esc(s) {
    if (!s) return '<span style="color:#ccc">—</span>';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Auth ─────────────────────────────────────────────────────────────────
  function showLogin() {
    adminPassword = null;
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
  }

  function showApp(pw) {
    adminPassword = pw;
    localStorage.setItem('ros_admin_pw', pw);
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadAll();
  }

  document.getElementById('pw-btn').addEventListener('click', tryLogin);
  document.getElementById('pw-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') tryLogin();
  });

  function tryLogin() {
    var pw = document.getElementById('pw-input').value.trim();
    if (!pw) return;
    document.getElementById('pw-btn').disabled = true;
    document.getElementById('login-error').style.display = 'none';
    fetch('/api/admin/stats', { headers: { 'x-admin-password': pw } })
      .then(function(r) {
        document.getElementById('pw-btn').disabled = false;
        if (r.status === 401 || r.status === 503) {
          document.getElementById('login-error').style.display = 'block';
        } else {
          r.json().then(function(d) { applyStats(d); showApp(pw); });
        }
      })
      .catch(function() {
        document.getElementById('pw-btn').disabled = false;
        document.getElementById('login-error').textContent = 'Network error. Is the server running?';
        document.getElementById('login-error').style.display = 'block';
      });
  }

  document.getElementById('logout-btn').addEventListener('click', function() {
    localStorage.removeItem('ros_admin_pw');
    showLogin();
  });

  // ── Tabs ─────────────────────────────────────────────────────────────────
  document.querySelectorAll('.tab').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
      document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    });
  });

  // ── Load all data ─────────────────────────────────────────────────────────
  function loadAll() {
    loadStats();
    loadSignups();
    loadWaitlist();
    loadCTA();
  }

  // ── Stats ─────────────────────────────────────────────────────────────────
  function applyStats(d) {
    document.getElementById('s-total').textContent   = d.total_signups   != null ? d.total_signups   : '—';
    document.getElementById('s-today').textContent   = d.signups_today   != null ? d.signups_today   : '—';
    document.getElementById('s-waitlist').textContent = d.waitlist_total != null ? d.waitlist_total : '—';
    document.getElementById('s-cta').textContent     = d.cta_clicks_total != null ? d.cta_clicks_total : '—';
    document.getElementById('s-conv').textContent    = d.conversion_rate != null ? d.conversion_rate + '%' : '—';
  }

  function loadStats() {
    apiGet('/api/admin/stats').then(applyStats).catch(function(){});
  }

  // ── Signups ───────────────────────────────────────────────────────────────
  function loadSignups() {
    apiGet('/api/admin/signups?limit=500').then(function(d) {
      document.getElementById('signup-count').textContent = d.total + ' total';
      var rows = d.data;
      if (!rows.length) {
        document.getElementById('signups-table-body').innerHTML = '<div class="no-data">No signups yet.</div>';
        return;
      }
      var html = '<table><thead><tr>' +
        '<th>Code</th><th>Store Name</th><th>Owner</th><th>Phone</th><th>Email</th>' +
        '<th>City</th><th>Status</th><th>Signed Up</th>' +
        '</tr></thead><tbody>';
      rows.forEach(function(r) {
        var badge = r.status === 'active'
          ? '<span class="badge badge-active">active</span>'
          : '<span class="badge badge-pending">' + esc(r.status) + '</span>';
        html += '<tr>' +
          '<td style="font-family:monospace;font-size:12px">' + esc(r.retailer_code) + '</td>' +
          '<td><strong>' + esc(r.retailer_name) + '</strong></td>' +
          '<td>' + esc(r.contact_person) + '</td>' +
          '<td>' + esc(r.mobile_number) + '</td>' +
          '<td>' + esc(r.email) + '</td>' +
          '<td>' + esc(r.city_name) + '</td>' +
          '<td>' + badge + '</td>' +
          '<td style="white-space:nowrap">' + fmtDate(r.onboarded_at) + '</td>' +
          '</tr>';
      });
      html += '</tbody></table>';
      document.getElementById('signups-table-body').innerHTML = html;
    }).catch(function(){
      document.getElementById('signups-table-body').innerHTML = '<div class="no-data">Failed to load signups.</div>';
    });
  }

  // ── Export CSV ────────────────────────────────────────────────────────────
  document.getElementById('export-btn').addEventListener('click', function() {
    var url = '/api/admin/export?adminPassword=' + encodeURIComponent(adminPassword);
    var a = document.createElement('a');
    a.href = url;
    a.download = '';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  });

  // ── Waitlist ──────────────────────────────────────────────────────────────
  function loadWaitlist() {
    apiGet('/api/admin/waitlist').then(function(d) {
      document.getElementById('waitlist-count').textContent = d.total + ' entries';
      var rows = d.data;
      if (!rows.length) {
        document.getElementById('waitlist-table-body').innerHTML = '<div class="no-data">No waitlist entries yet.</div>';
        return;
      }
      var html = '<table><thead><tr>' +
        '<th>Name</th><th>Phone</th><th>Email</th><th>Store Type</th><th>City</th><th>Source</th><th>Date</th>' +
        '</tr></thead><tbody>';
      rows.forEach(function(r) {
        html += '<tr>' +
          '<td>' + esc(r.name) + '</td>' +
          '<td>' + esc(r.phone) + '</td>' +
          '<td>' + esc(r.email) + '</td>' +
          '<td>' + esc(r.store_type) + '</td>' +
          '<td>' + esc(r.city) + '</td>' +
          '<td><span class="badge badge-active">' + esc(r.source) + '</span></td>' +
          '<td style="white-space:nowrap">' + fmtDate(r.created_at) + '</td>' +
          '</tr>';
      });
      html += '</tbody></table>';
      document.getElementById('waitlist-table-body').innerHTML = html;
    }).catch(function(){
      document.getElementById('waitlist-table-body').innerHTML = '<div class="no-data">Failed to load waitlist.</div>';
    });
  }

  // ── CTA stats ─────────────────────────────────────────────────────────────
  var CTA_LABELS = {
    'demo_link':        'Try Demo',
    'hero_get_started': 'Get Started (hero)',
    'signup_form':      'Sign Up Form Submit',
  };

  function loadCTA() {
    apiGet('/api/admin/cta-stats').then(function(d) {
      var byType = d.by_type;
      var byDay  = d.by_day;

      var maxCount = byType.reduce(function(m, r) { return Math.max(m, parseInt(r.count)); }, 1);

      var typeHtml = '';
      if (byType.length) {
        byType.forEach(function(r) {
          var count = parseInt(r.count);
          var pct = (count / maxCount * 100).toFixed(1);
          var label = CTA_LABELS[r.cta_id] || r.cta_id;
          typeHtml += '<div class="bar-row">' +
            '<div class="bar-label" title="' + esc(r.cta_id) + '">' + esc(label) + '</div>' +
            '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
            '<div class="bar-count">' + count + '</div>' +
            '</div>';
        });
      } else {
        typeHtml = '<p style="color:#9ca3af;font-size:13px">No CTA events yet.</p>';
      }

      var dayHtml = '';
      if (byDay.length) {
        var maxDay = byDay.reduce(function(m, r) { return Math.max(m, parseInt(r.count)); }, 1);
        byDay.slice(0, 14).forEach(function(r) {
          var count = parseInt(r.count);
          var pct = (count / maxDay * 100).toFixed(1);
          var day = r.day ? String(r.day).slice(0, 10) : '?';
          dayHtml += '<div class="bar-row">' +
            '<div class="bar-label">' + esc(day) + '</div>' +
            '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:#a78bfa"></div></div>' +
            '<div class="bar-count">' + count + '</div>' +
            '</div>';
        });
      } else {
        dayHtml = '<p style="color:#9ca3af;font-size:13px">No data.</p>';
      }

      document.getElementById('cta-grid').innerHTML =
        '<div class="cta-card"><h3>Clicks by Button</h3>' + typeHtml + '</div>' +
        '<div class="cta-card"><h3>Daily Clicks (last 14 days)</h3>' + dayHtml + '</div>';
    }).catch(function(){
      document.getElementById('cta-grid').innerHTML =
        '<div class="cta-card"><p style="color:#9ca3af;font-size:13px">Failed to load CTA data.</p></div>';
    });
  }

  // ── Auto-login from localStorage ─────────────────────────────────────────
  (function() {
    var saved = localStorage.getItem('ros_admin_pw');
    if (saved) {
      adminPassword = saved;
      // Verify it's still valid
      fetch('/api/admin/stats', { headers: { 'x-admin-password': saved } })
        .then(function(r) {
          if (r.ok) { r.json().then(function(d) { applyStats(d); showApp(saved); }); }
          else { showLogin(); }
        })
        .catch(function() { showLogin(); });
    }
  })();
</script>
</body>
</html>
